<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta name="viewport" content="width=divie-width, inital-scale=1.0">
    <title>Чат</title>
    <link rel="stylesheet" href="main.css">
    <link rel="shortcut" href="logo.jpg"/>
  </head>
  <body>
    <a href="index.html" class="back-link"> На главную </a>

    <div class="chat-container">
      <h2>Чат</h2>
      <div class="start-chat" id="startChatBlock">
            <input type="email" id="partnerEmail" placeholder="Email собеседника">
            <button class="btn btn-primary" onclick="startChat()" style="width: 100%;">Начать чат</button>
            <div id="startChatError" class="error-msg"></div>
        </div>
        
        <!-- Блок переписки (скрыт по умолчанию) -->
        <div id="chatBlock" style="display: none;">
            <div class="chat-header" id="chatHeader">Чат с...</div>
            <div class="messages-box" id="messagesBox"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Напишите сообщение..." onkeypress="handleEnter(event)">
                <button class="btn btn-primary" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWQTRrHHI0u0zuUrTj5vP0F-T0Dbd8kN8",
            authDomain: "num-of-the-day.firebaseapp.com",
            projectId: "num-of-the-day",
            storageBucket: "num-of-the-day.appspot.com",
            messagingSenderId: "1035941660633",
            appId: "1:1035941660633:web:6e71187a3d5ccc813a7bc8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let currentChatId = null;
        let partnerUid = null;
        let unsubscribeMessages = null;

        // Проверяем вход
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            
            // Сохраняем email в Firestore
            db.collection('users').doc(user.uid).set({
                email: user.email,
                displayName: user.displayName || '',
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        });

        // Поиск пользователя по email и создание чата
        async function startChat() {
            const email = document.getElementById('partnerEmail').value.trim();
            const errorEl = document.getElementById('startChatError');
            errorEl.textContent = '';

            if (!email) {
                errorEl.textContent = 'Введите email';
                return;
            }
            if (email === currentUser.email) {
                errorEl.textContent = 'Нельзя написать самому себе';
                return;
            }

            try {
                // Ищем пользователя по email
                const snapshot = await db.collection('users')
                    .where('email', '==', email)
                    .limit(1)
                    .get();

                if (snapshot.empty) {
                    errorEl.textContent = 'Пользователь с таким email не найден';
                    return;
                }

                const partnerDoc = snapshot.docs[0];
                partnerUid = partnerDoc.id;
                const partnerName = partnerDoc.data().displayName || email;

                // Проверяем, есть ли уже чат между нами
                const chatId = getChatId(currentUser.uid, partnerUid);
                const chatDoc = await db.collection('chats').doc(chatId).get();

                if (!chatDoc.exists) {
                    // Создаем новый чат
                    await db.collection('chats').doc(chatId).set({
                        participants: [currentUser.uid, partnerUid],
                        lastMessage: '',
                        lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                        lastMessageBy: currentUser.uid
                    });
                }

                // Открываем чат
                currentChatId = chatId;
                document.getElementById('startChatBlock').style.display = 'none';
                document.getElementById('chatBlock').style.display = 'block';
                document.getElementById('chatHeader').textContent = `Чат с ${partnerName}`;
                
                loadMessages();
            } catch (error) {
                console.error(error);
                errorEl.textContent = 'Ошибка: ' + error.message;
            }
        }

        // Генерируем уникальный ID чата (всегда одинаковый для пары пользователей)
        function getChatId(uid1, uid2) {
            return [uid1, uid2].sort().join('_');
        }

        // Загрузка сообщений в реальном времени
        function loadMessages() {
            if (unsubscribeMessages) unsubscribeMessages();

            const messagesBox = document.getElementById('messagesBox');
            messagesBox.innerHTML = '<div style="text-align: center; color: #99D98C;">Загрузка...</div>';

            unsubscribeMessages = db.collection('messages')
                .doc(currentChatId)
                .collection('items')
                .orderBy('timestamp', 'asc')
                .onSnapshot((snapshot) => {
                    messagesBox.innerHTML = '';
                    
                    if (snapshot.empty) {
                        messagesBox.innerHTML = '<div style="text-align: center; color: #99D98C;">Начните общение!</div>';
                        return;
                    }

                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const isMine = msg.senderId === currentUser.uid;
                        
                        const msgEl = document.createElement('div');
                        msgEl.className = `message ${isMine ? 'mine' : 'theirs'}`;
                        
                        const time = msg.timestamp?.toDate() 
                            ? msg.timestamp.toDate().toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'}) 
                            : '';
                        
                        msgEl.innerHTML = `
                            <div>${escapeHtml(msg.text)}</div>
                            <div class="message-time">${time}</div>
                        `;
                        messagesBox.appendChild(msgEl);
                    });

                    // Прокрутка вниз
                    messagesBox.scrollTop = messagesBox.scrollHeight;
                }, (error) => {
                    console.error(error);
                    messagesBox.innerHTML = '<div style="text-align: center; color: #ff6b6b;">Ошибка загрузки</div>';
                });
        }

        // Отправка сообщения
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';

            try {
                // Добавляем сообщение
                await db.collection('messages')
                    .doc(currentChatId)
                    .collection('items')
                    .add({
                        text: text,
                        senderId: currentUser.uid,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });

                // Обновляем lastMessage в chats
                await db.collection('chats').doc(currentChatId).update({
                    lastMessage: text,
                    lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                    lastMessageBy: currentUser.uid
                });
            } catch (error) {
                console.error(error);
                alert('Ошибка отправки: ' + error.message);
            }
        }

        function handleEnter(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат - Num of the Day</title>
    <link rel="stylesheet" href="main.css">
    <link rel="shortcut icon" href="logo.jpg"/>
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="back-link">← На главную</a>
        <span>Чат</span>
    </div>

    <div class="chat-layout">
        <div class="chat-sidebar">
            <div class="sidebar-header">
                <span>Диалоги</span>
                <button class="new-chat-btn" onclick="showNewChatForm()">+ Новый</button>
            </div>
            <div class="chat-list" id="chatList">
                <div style="padding: 20px; text-align: center; color: #99D98C;">Загрузка...</div>
            </div>
        </div>

        <div class="chat-main">
              <div id="emptyState" class="empty-state">
                <h3>Выберите чат слева</h3>
                <p>или начните новый диалог</p>
            </div>

            <div id="newChatForm" class="empty-state" style="display: none;">
                <div class="start-chat-form" style="width: 80%; max-width: 400px;">
                    <h3 style="margin-top: 0; color: #52B69A;">Новый чат</h3>
                    <input type="email" id="partnerEmail" placeholder="Email собеседника">
                    <button class="btn-primary" style="width: 100%;" onclick="startChat()">Найти и начать</button>
                    <div id="startChatError" class="error-msg"></div>
                    <button onclick="hideNewChatForm()" style="background: none; border: none; color: #99D98C; margin-top: 10px; cursor: pointer; text-decoration: underline;">Отмена</button>
                </div>
            </div>

            <div id="activeChat" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header" id="chatHeader">Чат с...</div>
                <div class="messages-box" id="messagesBox"></div>
                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="Напишите сообщение..." onkeypress="handleEnter(event)">
                    <button class="btn-primary" onclick="sendMessage()">Отправить</button>
                </div>
            </div>

        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWQTRrHHI0u0zuUrTj5vP0F-T0Dbd8kN8",
            authDomain: "num-of-the-day.firebaseapp.com",
            projectId: "num-of-the-day",
            storageBucket: "num-of-the-day.appspot.com",
            messagingSenderId: "1035941660633",
            appId: "1:1035941660633:web:6e71187a3d5ccc813a7bc8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let currentChatId = null;
        let partnerUid = null;
        let unsubscribeMessages = null;

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            db.collection('users').doc(user.uid).set({
                email: user.email,
                displayName: user.displayName || '',
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            
            loadChatList(); 
        });

        function showNewChatForm() {
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('activeChat').style.display = 'none';
            document.getElementById('newChatForm').style.display = 'flex';
            document.getElementById('partnerEmail').value = '';
            document.getElementById('startChatError').textContent = '';
        }

        function hideNewChatForm() {
            document.getElementById('newChatForm').style.display = 'none';
            document.getElementById('emptyState').style.display = 'flex';
        }

        function showActiveChat(partnerName) {
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('newChatForm').style.display = 'none';
            document.getElementById('activeChat').style.display = 'flex';
            document.getElementById('chatHeader').textContent = `Чат с ${partnerName}`;
        }

        async function loadChatList() {
            const listEl = document.getElementById('chatList');
            try {
                const snapshot = await db.collection('chats')
                    .where('participants', 'array-contains', currentUser.uid)
                    .orderBy('lastMessageTime', 'desc')
                    .get();

                if (snapshot.empty) {
                    listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: #99D98C;">Нет активных чатов</div>';
                    return;
                }

                listEl.innerHTML = '';
                for (const doc of snapshot.docs) {
                    const chat = doc.data();
                    const chatId = doc.id;
                    const pUid = chat.participants.find(uid => uid !== currentUser.uid);
                    
                    const userDoc = await db.collection('users').doc(pUid).get();
                    const pName = userDoc.data()?.displayName || userDoc.data()?.email || 'Неизвестно';

                    const time = chat.lastMessageTime ? chat.lastMessageTime.toDate().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}) : '';

                    const item = document.createElement('div');
                    item.className = 'chat-item';
                    if (currentChatId === chatId) item.classList.add('active');
                    
                    item.innerHTML = `
                        <div class="chat-item-name">${pName}</div>
                        <div class="chat-item-preview">${chat.lastMessage || 'Нет сообщений'} • ${time}</div>
                    `;
                    item.onclick = () => openChat(chatId, pUid, pName);
                    listEl.appendChild(item);
                }
            } catch (e) {
                console.error(e);
                // Если индекса нет, Firebase даст ссылку в консоль. Создай его по ссылке.
                listEl.innerHTML = '<div style="padding: 20px; color: #ff6b6b;">Ошибка. Проверь консоль (F12)</div>';
            }
        }

        async function startChat() {
            const email = document.getElementById('partnerEmail').value.trim();
            const errorEl = document.getElementById('startChatError');
            errorEl.textContent = '';

            if (!email || email === currentUser.email) {
                errorEl.textContent = 'Введите корректный email (не свой)';
                return;
            }

            try {
                const snapshot = await db.collection('users').where('email', '==', email).limit(1).get();
                if (snapshot.empty) {
                    errorEl.textContent = 'Пользователь не найден';
                    return;
                }

                const pDoc = snapshot.docs[0];
                partnerUid = pDoc.id;
                const pName = pDoc.data().displayName || email;
                currentChatId = getChatId(currentUser.uid, partnerUid);

                const chatDoc = await db.collection('chats').doc(currentChatId).get();
                if (!chatDoc.exists) {
                    await db.collection('chats').doc(currentChatId).set({
                        participants: [currentUser.uid, partnerUid],
                        lastMessage: '',
                        lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                        lastMessageBy: currentUser.uid
                    });
                }

                hideNewChatForm();
                showActiveChat(pName);
                loadMessages();
                loadChatList(); 
            } catch (error) {
                errorEl.textContent = 'Ошибка: ' + error.message;
            }
        }

        function openChat(chatId, pUid, pName) {
            currentChatId = chatId;
            partnerUid = pUid;
            
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));            
            showActiveChat(pName);
            loadMessages();
        }

        function getChatId(uid1, uid2) {
            return [uid1, uid2].sort().join('_');
        }

        function loadMessages() {
            if (unsubscribeMessages) unsubscribeMessages();
            const box = document.getElementById('messagesBox');
            box.innerHTML = '<div style="text-align: center; color: #99D98C;">Загрузка...</div>';

            unsubscribeMessages = db.collection('messages')
                .doc(currentChatId)
                .collection('items')
                .orderBy('timestamp', 'asc')
                .onSnapshot((snapshot) => {
                    box.innerHTML = '';
                    if (snapshot.empty) {
                        box.innerHTML = '<div style="text-align: center; color: #99D98C; margin-top: 20px;">Начните общение!</div>';
                        return;
                    }

                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const isMine = msg.senderId === currentUser.uid;
                        const time = msg.timestamp?.toDate() ? msg.timestamp.toDate().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}) : '';
                        
                        const el = document.createElement('div');
                        el.className = `message ${isMine ? 'mine' : 'theirs'}`;
                        el.innerHTML = `<div>${escapeHtml(msg.text)}</div><div class="message-time">${time}</div>`;
                        box.appendChild(el);
                    });
                    box.scrollTop = box.scrollHeight;
                });
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentChatId) return;
            input.value = '';

            try {
                await db.collection('messages').doc(currentChatId).collection('items').add({
                    text: text,
                    senderId: currentUser.uid,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                await db.collection('chats').doc(currentChatId).update({
                    lastMessage: text,
                    lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                    lastMessageBy: currentUser.uid
                });
            } catch (e) {
                alert('Ошибка отправки: ' + e.message);
            }
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    </script>
</body>
</html>

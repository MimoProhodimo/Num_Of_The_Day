<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo.jpg" />
    <title>Num of the Day</title>
    <link rel="stylesheet" href="main.css"/>
</head>
<body>

    <div class="label">Число дня</div>
    <div class="number" id="number">--</div>
    <div class="name" id="name">Загрузка...</div>
    <div class="lastname" id="lastname"></div>
    <div class="team" id="team"></div>
    <div class="country" id="country"></div>
    
    <button onclick="getNewDriver()">Новый гонщик</button>

    <br>
    <a href="calendar.html" style="color: #99D98C; text-decoration: none; margin-top: 20px; display: inline-block;">Календарь</a>
    
    <br><br>
    <button onclick="goToLogin()" id="loginBtn" style="background: #52B69A; color: #184E77; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-right: 10px;">Войти</button>
    <button onclick="logout()" id="logoutBtn" style="display: none; background: #DC2626; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px;">Выйти</button>
    <span id="userEmail" style="color: #99D98C; margin-left: 10px; font-size: 14px;"></span>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWQTRrHHI0u0zuUrTj5vP0F-T0Dbd8kN8",
            authDomain: "num-of-the-day.firebaseapp.com",
            projectId: "num-of-the-day",
            storageBucket: "num-of-the-day.appspot.com",
            messagingSenderId: "1035941660633",
            appId: "1:1035941660633:web:6e71187a3d5ccc813a7bc8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;

        auth.onAuthStateChanged((user) => {
            currentUser = user;
            if (user) {
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'inline-block';
                document.getElementById('userEmail').textContent = user.email;
            } else {
                document.getElementById('loginBtn').style.display = 'inline-block';
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('userEmail').textContent = '';
            }
            initApp();
        });

        function goToLogin() {
            window.location.href = 'login.html';
        }

        function logout() {
            auth.signOut().then(() => {
                location.reload();
            });
        }

        function getCurrentDate() {
            return new Date().toISOString().split('T')[0];
        }

        function displayDriver(driver) {
            document.getElementById('number').textContent = driver.Num || '?';
            document.getElementById('name').textContent = driver.Name || 'Неизвестно';
            document.getElementById('name').className = 'name';
            document.getElementById('lastname').textContent = driver.LName || '';
            document.getElementById('team').textContent = driver.Team || '';
            document.getElementById('country').textContent = driver.Country || '';
        }

        async function fetchNewDriver() {
            const nameEl = document.getElementById('name');
            nameEl.textContent = 'Загрузка...';
            nameEl.className = 'name loading';
            try {
                const snapshot = await db.collection('drivers').get();
                if (snapshot.empty) { nameEl.textContent = 'База пуста!'; return null; }
                const drivers = [];
                snapshot.forEach(doc => drivers.push(doc.data()));
                return drivers[Math.floor(Math.random() * drivers.length)];
            } catch (error) {
                console.error('Ошибка:', error);
                nameEl.textContent = 'Ошибка загрузки';
                return null;
            }
        }

        async function getNewDriver() {
            const driver = await fetchNewDriver();
            if (driver) {
                const today = getCurrentDate();
                
                if (currentUser) {
                    await db.collection('users').doc(currentUser.uid).collection('todayDriver').doc(today).set({
                        driver: driver,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else {
                    localStorage.setItem('driver_data', JSON.stringify(driver));
                    localStorage.setItem('driver_date', today);
                }
                
                displayDriver(driver);
            }
        }

        async function initApp() {
            const today = getCurrentDate();
            
            if (currentUser) {
                try {
                    const doc = await db.collection('users').doc(currentUser.uid).collection('todayDriver').doc(today).get();
                    if (doc.exists) {
                        displayDriver(doc.data().driver);
                        return;
                    }
                } catch (error) {
                    console.error('Ошибка загрузки из Firestore:', error);
                }
            }
            
            const savedDriverJSON = localStorage.getItem('driver_data');
            const savedDate = localStorage.getItem('driver_date');
            
            if (savedDriverJSON && savedDate === today) {
                displayDriver(JSON.parse(savedDriverJSON));
            } else {
                const driver = await fetchNewDriver();
                if (driver) {
                    if (currentUser) {
                        await db.collection('users').doc(currentUser.uid).collection('todayDriver').doc(today).set({
                            driver: driver,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } else {
                        localStorage.setItem('driver_data', JSON.stringify(driver));
                        localStorage.setItem('driver_date', today);
                    }
                    displayDriver(driver);
                }
            }
        }

        window.onload = () => {
        };
    </script>
</body>
</html>

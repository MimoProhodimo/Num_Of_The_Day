<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Num of the Day</title>
<link rel="stylesheet" href="main.css"/>
</head>
<body>

    <div class="label">Число дня</div>
    <div class="number" id="number">--</div>
    <div class="name" id="name">Загрузка...</div>
    <div class="lastname" id="lastname"></div>
    <div class="team" id="team"></div>
    <div class="country" id="country"></div>
    
    <button onclick="getRandomDriver()">Новый гонщик</button>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
        <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWQTRrHHI0u0zuUrTj5vP0F-T0Dbd8kN8",
            authDomain: "num-of-the-day.firebaseapp.com",
            projectId: "num-of-the-day",
            storageBucket: "num-of-the-day.appspot.com",
            messagingSenderId: "1035941660633",
            appId: "1:1035941660633:web:6e71187a3d5ccc813a7bc8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. Функция просто для отображения данных на экране (чтобы не дублировать код)
        function displayDriver(driver) {
            document.getElementById('number').textContent = driver.Num || '?';
            document.getElementById('name').textContent = driver.Name || 'Неизвестно';
            document.getElementById('name').className = 'name'; // Убираем класс загрузки
            document.getElementById('lastname').textContent = driver.LName || '';
            document.getElementById('team').textContent = driver.Team || '';
            document.getElementById('country').textContent = driver.Country || '';
        }

        async function getNewDriver() {
            const nameEl = document.getElementById('name');
            nameEl.textContent = 'Загрузка...';
            nameEl.className = 'name loading';
            
            try {
                const snapshot = await db.collection('drivers').get();
                
                if (snapshot.empty) {
                    nameEl.textContent = 'База пуста!';
                    return;
                }
                
                const drivers = [];
                snapshot.forEach(doc => drivers.push(doc.data()));
                const driver = drivers[Math.floor(Math.random() * drivers.length)];
                
                localStorage.setItem('savedDriver', JSON.stringify(driver));
                
                // Отображаем
                displayDriver(driver);
                
            } catch (error) {
                console.error('Ошибка:', error);
                nameEl.textContent = 'Ошибка загрузки';
            }
        }

        // 3. Функция, которая запускается при открытии сайта
        function initApp() {
            // Проверяем, есть ли уже сохраненный гонщик в памяти браузера
            const savedDriverJSON = localStorage.getItem('savedDriver');
            
            if (savedDriverJSON) {
                // Если есть, просто достаем его и показываем (без запроса к Firebase!)
                const driver = JSON.parse(savedDriverJSON);
                displayDriver(driver);
            } else {
                // Если нет (первый запуск), запрашиваем нового и сохраняем
                getNewDriver();
            }
        }

        // Запускаем проверку при загрузке страницы
        window.onload = initApp;
    </script>

</body>
</html>

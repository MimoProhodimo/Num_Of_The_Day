<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="logo.jpg" />
    <title>Num of the Day</title>
<link rel="stylesheet" href="main.css"/>
</head>
<body>

    <div class="label">Число дня</div>
    <div class="number" id="number">--</div>
    <div class="name" id="name">Загрузка...</div>
    <div class="lastname" id="lastname"></div>
    <div class="team" id="team"></div>
    <div class="country" id="country"></div>
    
    <button onclick="getNewDriver()">Новый гонщик</button>

    <br>
<a href="calendar.html" style="color: #99D98C; text-decoration: none; margin-top: 20px;">Календарь </a>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
           <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWQTRrHHI0u0zuUrTj5vP0F-T0Dbd8kN8",
            authDomain: "num-of-the-day.firebaseapp.com",
            projectId: "num-of-the-day",
            storageBucket: "num-of-the-day.appspot.com",
            messagingSenderId: "1035941660633",
            appId: "1:1035941660633:web:6e71187a3d5ccc813a7bc8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Получаем текущую дату в формате YYYY-MM-DD
        function getCurrentDate() {
            return new Date().toISOString().split('T')[0];
        }

        // Функция отображения гонщика на экране
        function displayDriver(driver) {
            document.getElementById('number').textContent = driver.Num || '?';
            document.getElementById('name').textContent = driver.Name || 'Неизвестно';
            document.getElementById('name').className = 'name';
            document.getElementById('lastname').textContent = driver.LName || '';
            document.getElementById('team').textContent = driver.Team || '';
            document.getElementById('country').textContent = driver.Country || '';
        }

        async function fetchNewDriver() {
            const nameEl = document.getElementById('name');
            nameEl.textContent = 'Загрузка...';
            nameEl.className = 'name loading';
            
            try {
                const snapshot = await db.collection('drivers').get();
                
                if (snapshot.empty) {
                    nameEl.textContent = 'База пуста!';
                    return null;
                }
                
                const drivers = [];
                snapshot.forEach(doc => drivers.push(doc.data()));
                const driver = drivers[Math.floor(Math.random() * drivers.length)];
                
                return driver;
                
            } catch (error) {
                console.error('Ошибка:', error);
                nameEl.textContent = 'Ошибка загрузки';
                return null;
            }
        }

        async function getNewDriver() {
            const driver = await fetchNewDriver();
            if (driver) {
                // Сохраняем гонщика И дату
                localStorage.setItem('driver_data', JSON.stringify(driver));
                localStorage.setItem('driver_date', getCurrentDate());
                displayDriver(driver);
            }
        }

        // Инициализация при загрузке страницы
        function initApp() {
            const savedDriverJSON = localStorage.getItem('driver_data');
            const savedDate = localStorage.getItem('driver_date');
            const today = getCurrentDate();
            
            if (savedDriverJSON && savedDate === today) {
                const driver = JSON.parse(savedDriverJSON);
                displayDriver(driver);
            } else {
                fetchNewDriver().then(driver => {
                    if (driver) {
                        localStorage.setItem('driver_data', JSON.stringify(driver));
                        localStorage.setItem('driver_date', today);
                        displayDriver(driver);
                    }
                });
            }
        }

        window.onload = initApp;
    </script>

</body>
</html>

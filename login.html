<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Num of the Day</title>
    <link rel="stylesheet" href="main.css">
    <link rel="shortcut icon" href="logo.jpg" />
<link rel="stylesheet" href="login.css"/>
</head>
<body>

    <div class="auth-container">
        <h2 id="authTitle">Вход в аккаунт</h2>
        
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль (мин. 6 символов)">
        
        <button class="auth-btn" onclick="handleAuth(false)" id="mainBtn">Войти</button>
        <button class="auth-btn secondary-btn" onclick="handleAuth(true)" id="regBtn" style="display:none;">Зарегистрироваться</button>
        
        <div class="error" id="errorText"></div>
        
        <div class="switch-link" onclick="toggleMode()" id="switchText">
            Нет аккаунта? Зарегистрироваться
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWQTRrHHI0u0zuUrTj5vP0F-T0Dbd8kN8",
            authDomain: "num-of-the-day.firebaseapp.com",
            projectId: "num-of-the-day",
            storageBucket: "num-of-the-day.appspot.com",
            messagingSenderId: "1035941660633",
            appId: "1:1035941660633:web:6e71187a3d5ccc813a7bc8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').textContent = isLoginMode ? 'Вход в аккаунт' : 'Регистрация';
            document.getElementById('mainBtn').textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
            document.getElementById('regBtn').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('switchText').textContent = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
            document.getElementById('errorText').textContent = '';
        }

        async function handleAuth(isRegister) {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorText = document.getElementById('errorText');
            
            errorText.textContent = '';
            
            if (!email || !password) {
                errorText.textContent = 'Заполни все поля!';
                return;
            }

            try {
                if (isRegister) {
                    await auth.createUserWithEmailAndPassword(email, password);
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
            } catch (error) {
                const errors = {
                    'auth/user-not-found': 'Пользователь не найден',
                    'auth/wrong-password': 'Неверный пароль',
                    'auth/email-already-in-use': 'Этот email уже зарегистрирован',
                    'auth/weak-password': 'Пароль слишком слабый (минимум 6 символов)',
                    'auth/invalid-email': 'Некорректный формат email'
                };
                errorText.textContent = errors[error.code] || 'Ошибка: ' + error.message;
            }
        }
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>

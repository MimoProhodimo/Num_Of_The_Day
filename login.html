<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Num of the Day</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div class="auth-container">
        <h2 id="authTitle">Вход в аккаунт</h2>
        
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль (мин. 6 символов)">
        
        <button class="auth-btn" onclick="handleAuth()" id="authBtn">Войти</button>
        
        <div class="error" id="errorText"></div>
        <div class="success" id="successText"></div>
        
        <div class="switch-link" onclick="toggleMode()" id="switchText">
            Нет аккаунта? Зарегистрироваться
        </div>
        
        <a href="index.html" class="back-link">← На главную</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWQTRrHHI0u0zuUrTj5vP0F-T0Dbd8kN8",
            authDomain: "num-of-the-day.firebaseapp.com",
            projectId: "num-of-the-day",
            storageBucket: "num-of-the-day.appspot.com",
            messagingSenderId: "1035941660633",
            appId: "1:1035941660633:web:6e71187a3d5ccc813a7bc8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                document.getElementById('authTitle').textContent = 'Вход в аккаунт';
                document.getElementById('authBtn').textContent = 'Войти';
                document.getElementById('switchText').textContent = 'Нет аккаунта? Зарегистрироваться';
            } else {
                document.getElementById('authTitle').textContent = 'Регистрация';
                document.getElementById('authBtn').textContent = 'Зарегистрироваться';
                document.getElementById('switchText').textContent = 'Уже есть аккаунт? Войти';
            }
            document.getElementById('errorText').textContent = '';
            document.getElementById('successText').textContent = '';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorText = document.getElementById('errorText');
            const successText = document.getElementById('successText');
            
            errorText.textContent = '';
            successText.textContent = '';
            
            if (!email || !password) {
                errorText.textContent = 'Заполни все поля!';
                return;
            }

            try {
                if (!isLoginMode) {
                    console.log("Регистрация...", email);
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    console.log("Успешно зарегистрирован:", userCredential.user.email);
                    successText.textContent = 'Регистрация успешна! Перенаправление...';
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                    
                } else {
                    console.log("Вход...", email);
                    await auth.signInWithEmailAndPassword(email, password);
                    console.log("Успешный вход!");
                    successText.textContent = 'Вход выполнен! Перенаправление...';
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                }
            } catch (error) {
                console.error("Ошибка:", error.code, error.message);
                const errors = {
                    'auth/user-not-found': 'Пользователь не найден',
                    'auth/wrong-password': 'Неверный пароль',
                    'auth/email-already-in-use': 'Этот email уже зарегистрирован',
                    'auth/weak-password': 'Пароль слишком слабый (минимум 6 символов)',
                    'auth/invalid-email': 'Некорректный формат email',
                    'auth/configuration-not-found': 'Firebase Auth не включен в консоли'
                };
                errorText.textContent = errors[error.code] || 'Ошибка: ' + error.message;
            }
        }

        auth.onAuthStateChanged((user) => {
            console.log("onAuthStateChanged:", user ? user.email : 'нет пользователя');
            if (user) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>

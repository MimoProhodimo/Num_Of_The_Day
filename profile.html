<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - Num of the Day</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="profile.css">
    <link rel="shortcut icon" href="logo.jpg" />
</head>
<body>
    <a href="index.html" class="back-link">На главную</a>
    
    <div class="profile-container">
        <div class="profile-header">
            <h2>Мой профиль</h2>
            
            <div class="info-row">
                <span class="info-label">Email:</span>
                <span class="info-value" id="userEmail">Загрузка...</span>
            </div>
            <div class="info-row">
                <span class="info-label">Имя:</span>
                <span class="info-value" id="userName">Не указано</span>
            </div>
            <div class="info-row">
                <span class="info-label">Дата регистрации:</span>
                <span class="info-value" id="registrationDate">...</span>
            </div>
        </div>

        <div class="section">
            <h3>Статистика</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="calendarDays">0</div>
                    <div class="stat-label">Отмечено дней в календаре</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h3>Изменить имя</h3>
            <div class="form-group">
                <input type="text" id="newName" placeholder="Введите новое имя">
            </div>
            <button class="btn btn-primary" onclick="updateName()">Сохранить имя</button>
            <div id="nameMessage"></div>
        </div>

        <div class="section">
            <h3>Изменить email</h3>
            <div class="form-group">
                <input type="email" id="newEmail" placeholder="Введите новый email">
            </div>
            <button class="btn btn-primary" onclick="updateEmail()">Изменить email</button>
            <div id="emailMessage"></div>
        </div>

        <div class="section">
            <h3>Изменить пароль</h3>
            <div class="form-group">
                <input type="password" id="newPassword" placeholder="Новый пароль (мин. 6 символов)">
            </div>
            <div class="form-group">
                <input type="password" id="confirmPassword" placeholder="Повторите пароль">
            </div>
            <button class="btn btn-primary" onclick="updatePassword()">Изменить пароль</button>
            <div id="passwordMessage"></div>
        </div>

        <div class="section" style="text-align: center;">
            <button class="btn btn-secondary" onclick="logout()">Выйти из аккаунта</button>
        </div>

        <div style="text-align: center; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
            <p style="color: #99D98C; font-size: 13px; margin-bottom: 10px;">Удаление аккаунта необратимо удалит все ваши данные.</p>
            <button class="btn btn-danger" onclick="confirmDeleteAccount()">Удалить аккаунт</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWQTRrHHI0u0zuUrTj5vP0F-T0Dbd8kN8",
            authDomain: "num-of-the-day.firebaseapp.com",
            projectId: "num-of-the-day",
            storageBucket: "num-of-the-day.appspot.com",
            messagingSenderId: "1035941660633",
            appId: "1:1035941660633:web:6e71187a3d5ccc813a7bc8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
            loadProfile();
        });

        async function loadProfile() {
            document.getElementById('userEmail').textContent = currentUser.email;
            document.getElementById('userName').textContent = currentUser.displayName || 'Не указано';
            
            const creationTime = currentUser.metadata.creationTime;
            if (creationTime) {
                const date = new Date(creationTime);
                document.getElementById('registrationDate').textContent = 
                    date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            }

            try {
                const calendarSnapshot = await db.collection('users').doc(currentUser.uid).collection('calendar').get();
                let activeDays = 0;
                calendarSnapshot.forEach(doc => {
                    if (doc.data().active) activeDays++;
                });
                document.getElementById('calendarDays').textContent = activeDays;
            } catch (error) {
                console.error('Ошибка загрузки статистики:', error);
            }
        }

        function showMessage(elementId, text, type) {
            const el = document.getElementById(elementId);
            el.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => el.innerHTML = '', 5000);
        }

        async function updateName() {
            const newName = document.getElementById('newName').value.trim();
            if (!newName) {
                showMessage('nameMessage', 'Введите имя', 'error');
                return;
            }
            try {
                await currentUser.updateProfile({ displayName: newName });
                document.getElementById('userName').textContent = newName;
                document.getElementById('newName').value = '';
                showMessage('nameMessage', 'Имя изменено', 'success');
            } catch (error) {
                showMessage('nameMessage', 'Ошибка: ' + error.message, 'error');
            }
        }

        async function updateEmail() {
            const newEmail = document.getElementById('newEmail').value.trim();
            if (!newEmail) {
                showMessage('emailMessage', 'Введите email', 'error');
                return;
            }
            try {
                await currentUser.updateEmail(newEmail);
                document.getElementById('userEmail').textContent = newEmail;
                document.getElementById('newEmail').value = '';
                showMessage('emailMessage', 'Email изменен', 'success');
            } catch (error) {
                if (error.code === 'auth/requires-recent-login') {
                    showMessage('emailMessage', 'Требуется повторный вход. Выйдите и войдите снова.', 'error');
                } else {
                    showMessage('emailMessage', 'Ошибка: ' + error.message, 'error');
                }
            }
        }

        async function updatePassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword || newPassword.length < 6) {
                showMessage('passwordMessage', 'Пароль должен быть минимум 6 символов', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage('passwordMessage', 'Пароли не совпадают', 'error');
                return;
            }

            try {
                await currentUser.updatePassword(newPassword);
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                showMessage('passwordMessage', 'Пароль изменен', 'success');
            } catch (error) {
                if (error.code === 'auth/requires-recent-login') {
                    showMessage('passwordMessage', 'Требуется повторный вход. Выйдите и войдите снова.', 'error');
                } else {
                    showMessage('passwordMessage', 'Ошибка: ' + error.message, 'error');
                }
            }
        }

        function logout() {
            auth.signOut().then(() => {
                window.location.href = 'index.html';
            });
        }

        function goToCalendar() {
            window.location.href = 'calendar.html';
        }

        async function confirmDeleteAccount() {
            const confirmed = confirm('Вы уверены? Это действие НЕОБРАТИМО. Все данные будут удалены.');
            if (!confirmed) return;

            const doubleCheck = prompt('Для подтверждения введите ваш email:\n' + currentUser.email);
            if (doubleCheck !== currentUser.email) {
                alert('Email не совпадает. Удаление отменено.');
                return;
            }

            await deleteAccount();
        }

        async function deleteAccount() {
            try {
                const userId = currentUser.uid;
                const calendarSnapshot = await db.collection('users').doc(userId).collection('calendar').get();
                const batch = db.batch();
                calendarSnapshot.forEach(doc => batch.delete(doc.ref));
                await batch.commit();

                const driverSnapshot = await db.collection('users').doc(userId).collection('todayDriver').get();
                const driverBatch = db.batch();
                driverSnapshot.forEach(doc => driverBatch.delete(doc.ref));
                await driverBatch.commit();

                await db.collection('users').doc(userId).delete();
                await currentUser.delete();

                alert('Аккаунт успешно удален.');
                window.location.href = 'index.html';
                
            } catch (error) {
                console.error('Ошибка удаления:', error);
                if (error.code === 'auth/requires-recent-login') {
                    alert('Для безопасности требуется повторный вход. Выйдите и войдите снова, затем попробуйте удалить аккаунт.');
                } else {
                    alert('Произошла ошибка при удалении: ' + error.message);
                }
            }
        }
    </script>
</body>
</html>
